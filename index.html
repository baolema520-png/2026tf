<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>2026</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="2026">
  <meta name="mobile-web-app-capable" content="yes">
  <style>
    :root {
      --bg: #f3e3cf;
      --bg2: #e8c9a4;
      --ink: #4a2e1c;
      --muted: #7a5340;
      --card: #fff7ee;
      --line: #e2c3a0;
      --accent: #c45c26;
      --accent2: #a9441c;
      --ok: #2f6b45;
      --shadow: 0 12px 36px rgba(90, 42, 16, .14);
      --fs: 18px;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Songti SC", serif;
      background:
        radial-gradient(900px 480px at 10% -10%, #ffe7c8 0%, transparent 55%),
        radial-gradient(800px 420px at 110% 10%, #f0c08a 0%, transparent 50%),
        linear-gradient(180deg, var(--bg) 0%, #f7d7b3 100%);
    }
    .wrap { width: min(760px, 92vw); margin: 0 auto; padding: 28px 0 72px; }
    .gate, .app { min-height: 100dvh; display: none; }
    .gate.on, .app.on { display: block; }
    .panel {
      margin: 18vh auto 0;
      width: min(420px, 92vw);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 28px 22px 24px;
    }
    .mark {
      width: 54px; height: 54px; border-radius: 16px;
      margin: 0 auto 16px;
      background: linear-gradient(160deg, #f0b27a, #c45c26);
      box-shadow: inset 0 0 0 3px rgba(255,255,255,.28);
    }
    .panel h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 22px;
      letter-spacing: .08em;
    }
    .panel p { margin: 0 0 18px; text-align: center; color: var(--muted); font-size: 14px; }
    input[type="password"] {
      width: 100%;
      border: 1px solid var(--line);
      background: #fffaf4;
      color: var(--ink);
      border-radius: 12px;
      padding: 14px 14px;
      font-size: 18px;
      letter-spacing: .16em;
      outline: none;
    }
    input[type="password"]:focus { border-color: var(--accent); }
    .go, button {
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font: inherit;
    }
    .go {
      width: 100%;
      margin-top: 12px;
      padding: 13px 16px;
      background: linear-gradient(180deg, var(--accent), var(--accent2));
      color: #fff8f1;
      font-size: 16px;
    }
    .err { min-height: 22px; margin-top: 10px; text-align: center; color: #a1271c; font-size: 13px; }
    .bar {
      position: sticky; top: 0; z-index: 5;
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
      padding: 12px 0 14px;
      background: linear-gradient(180deg, rgba(243,227,207,.96), rgba(243,227,207,.86));
    }
    .bar button, .fs {
      background: var(--card);
      color: var(--ink);
      border: 1px solid var(--line);
      padding: 9px 12px;
    }
    .bar .primary {
      background: linear-gradient(180deg, var(--accent), var(--accent2));
      color: #fff8f1;
      border-color: transparent;
    }
    .grow { flex: 1; }
    .item {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px 16px 14px;
      margin: 0 0 12px;
      box-shadow: var(--shadow);
      font-size: var(--fs);
      line-height: 1.7;
    }
    .item textarea {
      display: block;
      width: 100%;
      min-height: 88px;
      margin-top: 10px;
      border: 1px dashed #d2ae86;
      border-radius: 12px;
      background: #fffaf4;
      color: var(--ink);
      font: inherit;
      font-size: calc(var(--fs) - 1px);
      line-height: 1.6;
      padding: 10px;
      resize: vertical;
    }
    .hint {
      width: 100%;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .toast {
      position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
      background: #3d2416; color: #fff6ea; padding: 10px 14px; border-radius: 999px;
      font-size: 14px; display: none;
    }
    @media print {
      .gate, .bar, .hint, .toast { display: none !important; }
      .app.on { display: block !important; }
      body { background: #fff; }
      .item { box-shadow: none; break-inside: avoid; }
      .item textarea { border: 1px solid #d2ae86; }
    }
  </style>
</head>
<body>
  <section class="gate on" id="gate">
    <div class="panel">
      <div class="mark"></div>
      <h1>2026</h1>
      <p id="hint">请继续</p>
      <form id="form">
        <input id="k" type="password" autocomplete="off" inputmode="numeric" maxlength="32">
        <button class="go" type="submit">进入</button>
      </form>
      <div class="err" id="err"></div>
    </div>
  </section>
  <section class="app" id="app">
    <div class="wrap">
      <div class="bar">
        <button type="button" id="minus">A-</button>
        <span class="fs" id="fsLabel">18</span>
        <button type="button" id="plus">A+</button>
        <span class="grow"></span>
        <button type="button" class="primary" id="copy">复制全部</button>
        <button type="button" class="primary" id="notes">保存到备忘录</button>
        <button type="button" class="primary" id="pdf">保存 PDF</button>
        <button type="button" class="primary" id="epub">保存 EPUB</button>
        <p class="hint">先在本页写笔记。备忘录：分享菜单里选“备忘录”。PDF：打印窗口里选“存储为 PDF”。EPUB：用“图书”打开。以后要改内容，请回到本页再保存。</p>
      </div>
      <div id="list"></div>
    </div>
  </section>
  <div class="toast" id="toast"></div>
  <script>
    const P = {"s":"lyRUWizo/lrq7vao2c+DNA==","i":"EIredKckjTGT/t4X","t":"DiTVwJOjKStLzMQXIlRC5Q==","c":"avl/mzW1u3oinZSphIoDKnT9AGcNNxJwOp0nKrk9VjNkJxoTIQFdU/E9ZaKsTJF1EYNi+8CX4N8xRKnm8+p14T+vEMNPbpp8evsbwlbHkXsVL4sG7V1Pft9x2UneF/2A1LcSUBYBxWV6VVN+yPvAAb06UqsuY7R69oSEQcuky+iFfRK4eeMx0LLOuGUrnsK6Ii0iLqVpyk7pOEHMEWq7Krm+gD8P5PDAshlbZhA4akvvQABwzRSdux3/fipPFbUW+eLZHNleqLuPrbuHl+bszdpqwnKt5O4mn8+15k3KBaeexbAudBwU8Nyg1W8JmHZ7op8JmwB6WfuiBcXBVvQBth8HgnJX0c+hOiRpQi459nIzGUsIDEJJUBZmFJw859RXItnVwJudxlkE3yixnXWtvfhLcxWfUmkL3YVtp9iRsc/gOtjLmY1x4R57k7hkf/5ZraVfrHqAfYZkf1Zurxpe92THCNCdHPIvi+qz+XcMiwo97XvPw0Dd+BLZzsb/xpdbw0u1J2c4k8ctVQiu53eXDsuJMC1f9Zqdk2TVcwq3APIn30xHHqbqe0d33/vmiUzSu+IT6DLY7KgsIbK9wuehoOUqdz2dcPAI5JHa87Ih+FIAc+kjeMF0n1ibadJO6QTlijS0NMR93mOvoOx41UViS2qZgUOe/JF4AUr1czNiUwhth8uxBv40umMssxLC9ZUdZKStPsNafKvKhokzIMwb7TONd0UU1pQcZensEfYotYJRAGwY7zwhPYmc1tcWp0wFmFC680hPChfkh59rETgm9sJ0ALmW60u8s17tjbOLLhbIf6TygwJCK34mm+wpjp7YRQ+WraF1ABrp/xCGzD+bkRSKZT3odqnbkBQu5ySCVcU64Xfraun3RpcJQ36jhEdRHOiZAroqH+9sMCJTcuC8ofvi/iWuQsY7JG2MabnWljQmeKowizwP8tSQh3gmoJiHTnSaq8QitVjNkqOuprMDsqtpwM5fzK+bJ6gMMme0uYfdXhmY/ejluPYc3ix6cMQQ9yB+QPN10etSeuIzA+6J2sQoEDzZl82n966VIONnudiNqA9dK5tawBRLtgE3uLYgFHzCwUK3M0KVpS1ygKr+L+iwTUSDp9UYXZIyXqUwG3INurwX8q22TlYsh26rE/I7Gihi","n":180000};
    let Q = [];
    let fs = 18;
    let fails = 0;
    const $ = (id) => document.getElementById(id);
    const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
    function say(t) {
      const el = $("toast");
      el.textContent = t;
      el.style.display = "block";
      clearTimeout(say._t);
      say._t = setTimeout(() => { el.style.display = "none"; }, 1600);
    }
    async function openPack(pass) {
      const salt = b64(P.s);
      const iv = b64(P.i);
      const tag = b64(P.t);
      const data = b64(P.c);
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: P.n, hash: "SHA-256" },
        base,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
      const buf = new Uint8Array(data.length + tag.length);
      buf.set(data, 0);
      buf.set(tag, data.length);
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, buf);
      return JSON.parse(new TextDecoder().decode(plain));
    }
    function notesKey() { return "n2026"; }
    function loadNotes() {
      try { return JSON.parse(localStorage.getItem(notesKey()) || "[]"); } catch { return []; }
    }
    function saveNotes() {
      const notes = [].map.call(document.querySelectorAll(".item textarea"), (el) => el.value);
      localStorage.setItem(notesKey(), JSON.stringify(notes));
    }
    function paint() {
      const saved = loadNotes();
      $("list").innerHTML = Q.map((q, i) => {
        const note = (saved[i] || "").replace(/</g, "&lt;");
        return `<article class="item"><div>${q}</div><textarea placeholder="写笔记…">${note}</textarea></article>`;
      }).join("");
      [].forEach.call(document.querySelectorAll(".item textarea"), (el) => {
        el.addEventListener("input", saveNotes);
      });
    }
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
    function esc(s) {
      return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function currentNotes() {
      return [].map.call(document.querySelectorAll(".item textarea"), (el) => el.value);
    }
    function allText() {
      saveNotes();
      const notes = currentNotes();
      return Q.map((q, i) => {
        const note = (notes[i] || "").trim();
        return note ? q + "\n\n" + note : q;
      }).join("\n\n————\n\n");
    }
    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand("copy");
        ta.remove();
        return ok;
      }
    }
    function crc32(bytes) {
      let c = ~0;
      for (let i = 0; i < bytes.length; i++) c = (c >>> 8) ^ crc32.t[(c ^ bytes[i]) & 255];
      return (~c) >>> 0;
    }
    crc32.t = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
      crc32.t[i] = c >>> 0;
    }
    function u16(n) { return new Uint8Array([n & 255, (n >>> 8) & 255]); }
    function u32(n) { return new Uint8Array([n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255]); }
    function cat(parts) {
      const size = parts.reduce((n, p) => n + p.length, 0);
      const out = new Uint8Array(size);
      let o = 0;
      parts.forEach((p) => { out.set(p, o); o += p.length; });
      return out;
    }
    function zipStore(files) {
      const enc = new TextEncoder();
      const locals = [];
      const centrals = [];
      let offset = 0;
      files.forEach((file) => {
        const name = enc.encode(file.name);
        const data = file.data;
        const crc = crc32(data);
        const local = cat([
          u32(0x04034b50), u16(20), u16(0), u16(0), u16(0), u16(0),
          u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0),
          name, data
        ]);
        locals.push(local);
        centrals.push(cat([
          u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(0), u16(0),
          u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0),
          u16(0), u16(0), u16(0), u32(0), u32(offset), name
        ]));
        offset += local.length;
      });
      const central = cat(centrals);
      const end = cat([
        u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length),
        u32(central.length), u32(offset), u16(0)
      ]);
      return cat([...locals, central, end]);
    }
    function makeEpub() {
      saveNotes();
      const notes = currentNotes();
      const body = Q.map((q, i) => {
        const note = esc(notes[i]).replace(/\n/g, "<br>");
        return `<section><h2>${esc(q)}</h2><p>${note || " "}</p></section>`;
      }).join("");
      const xhtml = `<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="zh-Hans" lang="zh-Hans">
<head><meta charset="utf-8"/><title>2026</title>
<style>
body{font-family:serif;line-height:1.7;color:#4a2e1c}
section{margin:0 0 1.4em}
h2{font-size:1.05em;font-weight:600}
p{min-height:2.5em;padding:.6em .7em;border:1px dashed #d2ae86;background:#fff7ee}
</style></head>
<body>${body}</body></html>`;
      const enc = new TextEncoder();
      return zipStore([
        { name: "mimetype", data: enc.encode("application/epub+zip") },
        { name: "META-INF/container.xml", data: enc.encode(`<?xml version="1.0"?><container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container"><rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles></container>`) },
        { name: "OEBPS/content.opf", data: enc.encode(`<?xml version="1.0" encoding="utf-8"?>
<package xmlns="http://www.idpf.org/2007/opf" unique-identifier="bid" version="3.0">
<metadata xmlns:dc="http://purl.org/dc/elements/1.1/">
<dc:identifier id="bid">2026-notes</dc:identifier>
<dc:title>2026</dc:title>
<dc:language>zh-Hans</dc:language>
</metadata>
<manifest>
<item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/>
<item id="c1" href="notes.xhtml" media-type="application/xhtml+xml"/>
</manifest>
<spine><itemref idref="c1"/></spine>
</package>`) },
        { name: "OEBPS/nav.xhtml", data: enc.encode(`<?xml version="1.0" encoding="utf-8"?><html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops"><head><title>nav</title></head><body><nav epub:type="toc"><ol><li><a href="notes.xhtml">2026</a></li></ol></nav></body></html>`) },
        { name: "OEBPS/notes.xhtml", data: enc.encode(xhtml) }
      ]);
    }
    function applyFs() {
      document.documentElement.style.setProperty("--fs", fs + "px");
      $("fsLabel").textContent = String(fs);
    }
    function showApp() {
      $("gate").classList.remove("on");
      $("app").classList.add("on");
      paint();
      applyFs();
    }
    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const v = $("k").value.trim();
      $("err").textContent = "";
      if (fails >= 6) {
        $("err").textContent = "请稍后再试";
        return;
      }
      try {
        Q = await openPack(v);
        if (!Array.isArray(Q) || !Q.length) throw 0;
        $("k").value = "";
        showApp();
      } catch {
        fails += 1;
        $("err").textContent = "无法继续";
        $("k").value = "";
      }
    });
    $("minus").onclick = () => { fs = Math.max(14, fs - 2); applyFs(); };
    $("plus").onclick = () => { fs = Math.min(34, fs + 2); applyFs(); };
    $("copy").onclick = async () => {
      await copyText(Q.join("\n\n"));
      say("已复制");
    };
    $("notes").onclick = async () => {
      const text = allText();
      if (navigator.share) {
        try {
          await navigator.share({ title: "2026", text });
          say("分享菜单里选“备忘录”");
          return;
        } catch (err) {
          if (err && err.name === "AbortError") return;
        }
      }
      await copyText(text);
      say("已复制，可粘贴到备忘录");
    };
    $("pdf").onclick = () => {
      saveNotes();
      say("在打印窗口选择“存储为 PDF”");
      setTimeout(() => window.print(), 200);
    };
    $("epub").onclick = async () => {
      const data = makeEpub();
      const file = new File([data], "notes.epub", { type: "application/epub+zip" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file] });
          say("可选“图书”或“存储到文件”");
          return;
        } catch (err) {
          if (err && err.name === "AbortError") return;
        }
      }
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([data], { type: "application/epub+zip" }));
      a.download = "notes.epub";
      document.body.appendChild(a);
      a.click();
      a.remove();
      say("已保存 EPUB，可用“图书”打开");
    };
  </script>
</body>
</html>
