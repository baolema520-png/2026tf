<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>2026</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="2026">
  <meta name="mobile-web-app-capable" content="yes">
  <style>
    :root {
      --bg: #f3e3cf;
      --bg2: #e8c9a4;
      --ink: #4a2e1c;
      --muted: #7a5340;
      --card: #fff7ee;
      --line: #e2c3a0;
      --accent: #c45c26;
      --accent2: #a9441c;
      --ok: #2f6b45;
      --shadow: 0 12px 36px rgba(90, 42, 16, .14);
      --fs: 18px;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Songti SC", serif;
      background:
        radial-gradient(900px 480px at 10% -10%, #ffe7c8 0%, transparent 55%),
        radial-gradient(800px 420px at 110% 10%, #f0c08a 0%, transparent 50%),
        linear-gradient(180deg, var(--bg) 0%, #f7d7b3 100%);
    }
    .wrap { width: min(760px, 92vw); margin: 0 auto; padding: 28px 0 72px; }
    .gate, .app { min-height: 100dvh; display: none; }
    .gate.on, .app.on { display: block; }
    .panel {
      margin: 18vh auto 0;
      width: min(420px, 92vw);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 28px 22px 24px;
    }
    .mark {
      width: 54px; height: 54px; border-radius: 16px;
      margin: 0 auto 16px;
      background: linear-gradient(160deg, #f0b27a, #c45c26);
      box-shadow: inset 0 0 0 3px rgba(255,255,255,.28);
    }
    .panel h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 22px;
      letter-spacing: .08em;
    }
    .panel p { margin: 0 0 18px; text-align: center; color: var(--muted); font-size: 14px; }
    input[type="password"] {
      width: 100%;
      border: 1px solid var(--line);
      background: #fffaf4;
      color: var(--ink);
      border-radius: 12px;
      padding: 14px 14px;
      font-size: 18px;
      letter-spacing: .16em;
      outline: none;
    }
    input[type="password"]:focus { border-color: var(--accent); }
    .go, button {
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font: inherit;
    }
    .go {
      width: 100%;
      margin-top: 12px;
      padding: 13px 16px;
      background: linear-gradient(180deg, var(--accent), var(--accent2));
      color: #fff8f1;
      font-size: 16px;
    }
    .err { min-height: 22px; margin-top: 10px; text-align: center; color: #a1271c; font-size: 13px; }
    .bar {
      position: sticky; top: 0; z-index: 5;
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
      padding: 12px 0 14px;
      background: linear-gradient(180deg, rgba(243,227,207,.96), rgba(243,227,207,.86));
    }
    .bar button, .fs {
      background: var(--card);
      color: var(--ink);
      border: 1px solid var(--line);
      padding: 9px 12px;
    }
    .bar .primary {
      background: linear-gradient(180deg, var(--accent), var(--accent2));
      color: #fff8f1;
      border-color: transparent;
    }
    .grow { flex: 1; }
    .item {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px 16px 14px;
      margin: 0 0 12px;
      box-shadow: var(--shadow);
      font-size: var(--fs);
      line-height: 1.7;
    }
    .item textarea {
      display: block;
      width: 100%;
      min-height: 88px;
      margin-top: 10px;
      border: 1px dashed #d2ae86;
      border-radius: 12px;
      background: #fffaf4;
      color: var(--ink);
      font: inherit;
      font-size: calc(var(--fs) - 1px);
      line-height: 1.6;
      padding: 10px;
      resize: vertical;
    }
    .hint {
      width: 100%;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .toast {
      position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
      background: #3d2416; color: #fff6ea; padding: 10px 14px; border-radius: 999px;
      font-size: 14px; display: none;
    }
  </style>
</head>
<body>
  <section class="gate on" id="gate">
    <div class="panel">
      <div class="mark"></div>
      <h1>2026</h1>
      <p id="hint">请继续</p>
      <form id="form">
        <input id="k" type="password" autocomplete="off" inputmode="numeric" maxlength="32">
        <button class="go" type="submit">进入</button>
      </form>
      <div class="err" id="err"></div>
    </div>
  </section>
  <section class="app" id="app">
    <div class="wrap">
      <div class="bar">
        <button type="button" id="minus">A-</button>
        <span class="fs" id="fsLabel">18</span>
        <button type="button" id="plus">A+</button>
        <span class="grow"></span>
        <button type="button" class="primary" id="copy">复制全部</button>
        <button type="button" class="primary" id="dl">导出给 Documents</button>
        <p class="hint">笔记请直接写在本页（Safari 会记住）。iPhone 不能从“文件”用 Safari 打开本地网页。若要离线：分享 → 添加到主屏幕。</p>
      </div>
      <div id="list"></div>
    </div>
  </section>
  <div class="toast" id="toast"></div>
  <script>
    const P = {"s":"lyRUWizo/lrq7vao2c+DNA==","i":"EIredKckjTGT/t4X","t":"DiTVwJOjKStLzMQXIlRC5Q==","c":"avl/mzW1u3oinZSphIoDKnT9AGcNNxJwOp0nKrk9VjNkJxoTIQFdU/E9ZaKsTJF1EYNi+8CX4N8xRKnm8+p14T+vEMNPbpp8evsbwlbHkXsVL4sG7V1Pft9x2UneF/2A1LcSUBYBxWV6VVN+yPvAAb06UqsuY7R69oSEQcuky+iFfRK4eeMx0LLOuGUrnsK6Ii0iLqVpyk7pOEHMEWq7Krm+gD8P5PDAshlbZhA4akvvQABwzRSdux3/fipPFbUW+eLZHNleqLuPrbuHl+bszdpqwnKt5O4mn8+15k3KBaeexbAudBwU8Nyg1W8JmHZ7op8JmwB6WfuiBcXBVvQBth8HgnJX0c+hOiRpQi459nIzGUsIDEJJUBZmFJw859RXItnVwJudxlkE3yixnXWtvfhLcxWfUmkL3YVtp9iRsc/gOtjLmY1x4R57k7hkf/5ZraVfrHqAfYZkf1Zurxpe92THCNCdHPIvi+qz+XcMiwo97XvPw0Dd+BLZzsb/xpdbw0u1J2c4k8ctVQiu53eXDsuJMC1f9Zqdk2TVcwq3APIn30xHHqbqe0d33/vmiUzSu+IT6DLY7KgsIbK9wuehoOUqdz2dcPAI5JHa87Ih+FIAc+kjeMF0n1ibadJO6QTlijS0NMR93mOvoOx41UViS2qZgUOe/JF4AUr1czNiUwhth8uxBv40umMssxLC9ZUdZKStPsNafKvKhokzIMwb7TONd0UU1pQcZensEfYotYJRAGwY7zwhPYmc1tcWp0wFmFC680hPChfkh59rETgm9sJ0ALmW60u8s17tjbOLLhbIf6TygwJCK34mm+wpjp7YRQ+WraF1ABrp/xCGzD+bkRSKZT3odqnbkBQu5ySCVcU64Xfraun3RpcJQ36jhEdRHOiZAroqH+9sMCJTcuC8ofvi/iWuQsY7JG2MabnWljQmeKowizwP8tSQh3gmoJiHTnSaq8QitVjNkqOuprMDsqtpwM5fzK+bJ6gMMme0uYfdXhmY/ejluPYc3ix6cMQQ9yB+QPN10etSeuIzA+6J2sQoEDzZl82n966VIONnudiNqA9dK5tawBRLtgE3uLYgFHzCwUK3M0KVpS1ygKr+L+iwTUSDp9UYXZIyXqUwG3INurwX8q22TlYsh26rE/I7Gihi","n":180000};
    let Q = [];
    let fs = 18;
    let fails = 0;
    const $ = (id) => document.getElementById(id);
    const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
    function say(t) {
      const el = $("toast");
      el.textContent = t;
      el.style.display = "block";
      clearTimeout(say._t);
      say._t = setTimeout(() => { el.style.display = "none"; }, 1600);
    }
    async function openPack(pass) {
      const salt = b64(P.s);
      const iv = b64(P.i);
      const tag = b64(P.t);
      const data = b64(P.c);
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: P.n, hash: "SHA-256" },
        base,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
      const buf = new Uint8Array(data.length + tag.length);
      buf.set(data, 0);
      buf.set(tag, data.length);
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, buf);
      return JSON.parse(new TextDecoder().decode(plain));
    }
    function notesKey() { return "n2026"; }
    function loadNotes() {
      try { return JSON.parse(localStorage.getItem(notesKey()) || "[]"); } catch { return []; }
    }
    function saveNotes() {
      const notes = [].map.call(document.querySelectorAll(".item textarea"), (el) => el.value);
      localStorage.setItem(notesKey(), JSON.stringify(notes));
    }
    function paint() {
      const saved = loadNotes();
      $("list").innerHTML = Q.map((q, i) => {
        const note = (saved[i] || "").replace(/</g, "&lt;");
        return `<article class="item"><div>${q}</div><textarea placeholder="写笔记…">${note}</textarea></article>`;
      }).join("");
      [].forEach.call(document.querySelectorAll(".item textarea"), (el) => {
        el.addEventListener("input", saveNotes);
      });
    }
    function packPage() {
      const notes = [].map.call(document.querySelectorAll(".item textarea"), (el) => el.value);
      const items = Q.map((q, i) => {
        const note = (notes[i] || "").replace(/&/g, "&amp;").replace(/</g, "&lt;");
        return `<section class="q"><p>${q}</p><textarea placeholder="写笔记…">${note}</textarea></section>`;
      }).join("");
      return `<!DOCTYPE html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>笔记</title>
<style>
body{margin:0;background:#f3e3cf;color:#4a2e1c;font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC",serif}
.wrap{width:min(760px,92vw);margin:0 auto;padding:22px 0 64px}
.q{background:#fff7ee;border:1px solid #e2c3a0;border-radius:16px;padding:14px;margin:0 0 14px}
p{margin:0 0 10px;line-height:1.7;font-size:18px}
textarea{width:100%;min-height:88px;border:1px dashed #d2ae86;border-radius:12px;padding:10px;background:#fffaf4;font:inherit;line-height:1.6;box-sizing:border-box}
.tip{color:#7a5340;font-size:13px;margin:0 0 14px}
</style></head><body><div class="wrap">
<p class="tip">在“文件”中请打开 notes.webarchive。Safari 不能直接打开普通的 .html 本地文件。</p>
${items}
</div></body></html>`;
    }
    function toArchive(html) {
      const raw = btoa(unescape(encodeURIComponent(html))).replace(/(.{76})/g, "$1\n");
      return `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>WebMainResource</key>
  <dict>
    <key>WebResourceData</key>
    <data>
${raw}
    </data>
    <key>WebResourceMIMEType</key>
    <string>text/html</string>
    <key>WebResourceTextEncodingName</key>
    <string>UTF-8</string>
    <key>WebResourceURL</key>
    <string>file:///notes.html</string>
  </dict>
</dict>
</plist>`;
    }
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
    async function saveArchive() {
      saveNotes();
      const archive = toArchive(packPage());
      const file = new File([archive], "notes.webarchive", { type: "application/octet-stream" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file] });
          say("请选择“存储到文件”");
          return;
        } catch (err) {
          if (err && err.name === "AbortError") return;
        }
      }
      if (navigator.serviceWorker && navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage({ type: "pack", body: archive });
        location.href = new URL("notes.webarchive?t=" + Date.now(), location.href).href;
        say("正在保存 notes.webarchive");
        return;
      }
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([archive], { type: "application/octet-stream" }));
      a.download = "notes.webarchive";
      document.body.appendChild(a);
      a.click();
      a.remove();
      say("已保存 notes.webarchive");
    }
    function applyFs() {
      document.documentElement.style.setProperty("--fs", fs + "px");
      $("fsLabel").textContent = String(fs);
    }
    function showApp() {
      $("gate").classList.remove("on");
      $("app").classList.add("on");
      paint();
      applyFs();
    }
    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const v = $("k").value.trim();
      $("err").textContent = "";
      if (fails >= 6) {
        $("err").textContent = "请稍后再试";
        return;
      }
      try {
        Q = await openPack(v);
        if (!Array.isArray(Q) || !Q.length) throw 0;
        $("k").value = "";
        showApp();
      } catch {
        fails += 1;
        $("err").textContent = "无法继续";
        $("k").value = "";
      }
    });
    $("minus").onclick = () => { fs = Math.max(14, fs - 2); applyFs(); };
    $("plus").onclick = () => { fs = Math.min(34, fs + 2); applyFs(); };
    $("copy").onclick = async () => {
      const text = Q.join("\n\n");
      try {
        await navigator.clipboard.writeText(text);
        say("已复制");
      } catch {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
        say("已复制");
      }
    };
    $("dl").onclick = () => { saveArchive(); };
  </script>
</body>
</html>
